[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wetlabdb"
version = "0.3.0"
description = "Wet-lab compound database with a hosted web UI (MongoDB or standalone JSON storage)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rdkit>=2023.03.1",
    "pandas>=1.5.3",
    "Pillow>=9.4.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.1",
]

[project.optional-dependencies]
mongo = ["pymongo>=4.3.3"]
build = ["pyinstaller>=6.0.0"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mongomock>=4.1",
    "httpx>=0.27",
    "ortools>=9.8",
    "ruff>=0.4",
    "mypy>=1.8",
    "pip-audit>=2.7",
]
sar = ["ortools>=9.8"]

[project.scripts]
wetlabdb = "wetlabdb.__main__:main"

[tool.setuptools.packages.find]
include = ["wetlabdb*"]
exclude = ["tests*", "build*", "dist*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
files = [
  "wetlabdb/api",
  "wetlabdb/services",
  "wetlabdb/storage",
  "wetlabdb/settings.py",
  "wetlabdb/schema",
  "wetlabdb/chem",
  "wetlabdb/sar",
]
exclude = ["wetlabdb/ui/"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["wetlabdb.ui.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["wetlabdb.chem.*", "wetlabdb.sar.*"]
disable_error_code = [
  "attr-defined",
  "call-overload",
  "unused-ignore",
  "assignment",
  "arg-type",
  "var-annotated",
]
